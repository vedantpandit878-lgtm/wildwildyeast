name: Build Voice Agent APK

on:
  push:
    paths:
      - "android-agent/**"
      - ".github/workflows/android-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run core tests and build the debug APK
        run: ./gradlew :core:test :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VoiceAgent.apk

      - name: Upload the APK (download it from this run's Artifacts section)
        uses: actions/upload-artifact@v4
        with:
          name: VoiceAgent-apk
          path: android-agent/VoiceAgent.apk
          retention-days: 30
